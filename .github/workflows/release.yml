name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release
      packages: write # GHCR image
      id-token: write # keyless cosign signature
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: make check
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.name.outputs.image }}:${{ env.TAG }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image
        run: cosign sign --yes "${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}"
      - name: Release assets
        run: |
          mkdir dist
          go run ./cmd/k0nnect manifest --image "${{ steps.name.outputs.image }}:${TAG}@${{ steps.build.outputs.digest }}" > dist/install.yaml
          make build
          cp bin/k0nnect dist/k0nnect-linux-amd64
          (cd dist && sha256sum install.yaml k0nnect-linux-amd64 > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/install.yaml dist/k0nnect-linux-amd64 dist/SHA256SUMS --title "$TAG" --generate-notes --verify-tag
